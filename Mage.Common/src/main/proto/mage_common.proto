syntax = "proto3";

package mage.proto;

option java_package = "mage.proto";
option java_outer_classname = "MageProtos";
option java_multiple_files = true;

// Common timestamp message
message Timestamp {
  int64 millis = 1;
}

// MageVersion - matches mage.utils.MageVersion
message MageVersion {
  int32 major = 1;
  int32 minor = 2;
  int32 release = 3;  // called "release" in Java, not "patch"
  string release_info = 4;  // called "releaseInfo" in Java, not "info"
}

// PlayerType - matches mage.players.PlayerType exactly
enum PlayerType {
  PLAYER_TYPE_UNSPECIFIED = 0;
  PLAYER_TYPE_HUMAN = 1;
  PLAYER_TYPE_COMPUTER_DRAFT_BOT = 2;
  PLAYER_TYPE_COMPUTER_MONTE_CARLO = 3;
  PLAYER_TYPE_COMPUTER_MAD = 4;
}

