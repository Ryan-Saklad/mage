  MANA_TYPE_BLUE = 2;
  MANA_TYPE_GREEN = 3;
  MANA_TYPE_RED = 4;
  MANA_TYPE_WHITE = 5;
  MANA_TYPE_GENERIC = 6;
  MANA_TYPE_COLORLESS = 7;
}

